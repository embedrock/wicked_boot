[pytest]
testpaths = test/pytest
python_files = test_*.py *_test.py
python_functions = test_*
addopts = -vv --import-mode=importlib
markers =
    qemu_only: marks tests that can only run on QEMU emulator
    hil_only: marks tests that can only run on real hardware (HIL)
    smoke: marks tests as basic smoke tests