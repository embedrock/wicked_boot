name: Tests

on:
  push:
    branches: [ '**' ]  # Запускать на ВСЕХ ветках
  pull_request:
    branches: [ main, master ]

jobs:

  host-tests:
    name: Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++

      - name: Configure CMake
        run: cmake --preset host-test

      - name: Build tests
        run: cmake --build --preset host-test

      - name: Run tests
        run: ctest --test-dir build/host-test --output-on-failure --output-junit ${{ github.workspace }}/build/host-test/test-results.xml

      - name: Debug - check generated files
        if: success() || failure()
        run: |
          echo "=== Contain of ==="
          ls -la build/host-test/
          echo "=== find any .xml ==="
          find ${{ github.workspace }} -name "*.xml"

      - name: Publish Test Report
        if: success() || failure()
        uses: dorny/test-reporter@v1
        with:
          name: Host Unit Tests Report
          path: build/host-test/test-results.xml
          reporter: java-junit

  qemu-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker environment
        run: docker compose build stm32-dev

      - name: Clean build for qemu-f4
        run: |
          docker compose run --rm stm32-dev rm -rf build

      - name: Configure CMake (qemu-f4)
        run: |
          docker compose run --rm stm32-dev cmake --preset qemu-f4

      - name: Build firmware (qemu-f4)
        run: |
          docker compose run --rm stm32-dev cmake --build --preset qemu-f4

      - name: Run pytest in Docker
        run: |
          docker compose run --rm stm32-dev pytest \
            --junitxml=build/test-results.xml \
            -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-results-${{ github.run_id }}
          path: |
            build/test-results.xml
            build/qemu_serial.txt
          retention-days: 7

  build-stm32f4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean build for stm32f4-debug
        run: docker compose run --rm stm32-dev rm -rf build/stm32f4-debug

      - name: Configure CMake (stm32f4-debug)
        run: docker compose run --rm stm32-dev cmake --preset stm32f4-debug

      - name: Build firmware (stm32f4-debug)
        run: docker compose run --rm stm32-dev cmake --build --preset stm32f4-debug

      - name: Upload STM32F4 Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stm32f4-firmware  
          path: build/stm32f4-debug/wicked_boot.bin
          if-no-files-found: error

  test-hil:
    name: HIL Tests (Real Hardware)
    needs: build-stm32f4
    runs-on: [self-hosted, hil, stm32f4]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built firmware
        uses: actions/download-artifact@v4
        with:
          name: stm32f4-firmware
          path: build/stm32f4-debug/

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pytest pyserial

      - name: Run HIL Tests
        run: |
          echo "🚀 Starting HIL tests..."
          # Запускаем pytest, фильтруя только тесты с меткой hil_only
          # Путь к файлу теперь указывает на скачанный артефакт
          pytest test/pytest/ -m hil_only --target=hil --port /dev/ttyUSB0 --fw-image build/stm32f4-debug/wicked_boot.bin -v -s